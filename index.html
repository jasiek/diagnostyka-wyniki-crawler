<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab results</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>Lab results</h1>
      <input id="filter" type="search" placeholder="Filter parameters…" autocomplete="off" />
      <div class="actions">
        <button id="clear-all" type="button">Clear all</button>
        <span id="selection-count">0 selected</span>
      </div>
    </header>
    <div id="parameter-list"></div>
    <footer>
      <p>Y-axis: <code>(value − midpoint) / (range / 2)</code></p>
      <p>Shaded band = reference range. <code>0</code> = midpoint, <code>±1</code> = limits.</p>
    </footer>
  </aside>
  <main>
    <div id="chart-wrap">
      <canvas id="chart"></canvas>
    </div>
    <div id="empty-state">
      <p>Select one or more parameters from the left to plot them.</p>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
